<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sana Khan ✨</title>
    <style>
        body {
            font-family: 'Playfair Display', 'Georgia', serif;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 50%, #2d251e 100%);
            color: #f3e5ab;
            text-align: center;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 0;
        }
        .luxury-card {
            max-width: 440px;
            width: 85%;
            background: rgba(25, 25, 25, 0.75);
            padding: 30px 25px;
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(20px);
            position: relative;
        }
        .profile-frame {
            width: 140px; height: 140px; margin: 0 auto 15px auto; border-radius: 50%; padding: 4px;
            background: linear-gradient(45deg, #ffe57f, #d4af37, #aa7c11);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }
        .profile-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid #1a1a1a; }
        h1 { font-size: 1.5rem; font-weight: 300; letter-spacing: 2px; margin: 0 0 5px 0; color: #d4af37; }
        .name { font-size: 2.5rem; font-weight: bold; letter-spacing: 3px; background: linear-gradient(45deg, #ffe57f, #d4af37, #aa7c11); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; display: block; }
        
        .video-box {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 15px 0;
            background: #000;
        }
        .video-box video {
            width: 100%;
            display: block;
        }

        .note-box { background: rgba(212, 175, 55, 0.05); padding: 15px 20px; border-radius: 12px; border-left: 3px solid #d4af37; text-align: left; margin-top: 15px; }
        .note-box p { font-size: 1rem; line-height: 1.6; color: #e0e0e0; margin: 0; font-style: italic; }
        .particle { position: absolute; background: radial-gradient(circle, rgba(255,229,127,0.8) 0%, rgba(212,175,55,0) 70%); border-radius: 50%; pointer-events: none; animation: floatUp 8s infinite linear; }
        @keyframes floatUp { 0% { transform: translateY(80vh) scale(0.5); opacity: 0; } 50% { opacity: 0.6; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }
    </style>
</head>
<body>
    <div class="particle" style="width: 8px; height: 8px; left: 15%; animation-duration: 7s;"></div>
    <div class="particle" style="width: 12px; height: 12px; left: 75%; animation-duration: 10s;"></div>

    <div class="luxury-card">
        <!-- Main profile picture -->
        <div class="profile-frame"><img src="sana pic.jpeg" alt="Sana Khan"></div>
        <h1>HAPPY BIRTHDAY</h1>
        <span class="name">SANA KHAN</span>
        
        <!-- Video Box -->
        <div class="video-box">
            <video controls poster="sana pic.jpeg">
                <source src="fbwsxikh_1791130061_39702074066.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- Luxury College Friend Note -->
        <div class="note-box">
            <p>"To the most elegant friend from college classes to campus laughs, you bring so much grace and brilliance into our lives. Wishing you a luxury year ahead filled with endless success, beauty, and joy. Happy Birthday, Sana! ✨🎓"</p>
        </div>
    </div>
</body>
</html>
